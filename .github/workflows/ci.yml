# Build and test every pull request, and every push to main (#24).
#
# Two legs, because the two things worth checking cannot both be checked in one place:
#
#   * **ubuntu** provisions the real test database and is therefore the only leg where the ~150 live
#     Postgres tests actually run. It uses `build/test-db.sh` rather than a GitHub `services:` container,
#     and that is the whole point: the script loads pagila *and* writes the marker row that
#     `PgTestServer.RequireWritableAsync` checks before any test creates or drops an object. A bare service
#     container has neither, so every catalog test would still skip — quietly, which is the state #24 exists
#     to end.
#   * **windows** is where the app ships and where the platform-specific paths live: the Windows credential
#     store (§1.1), `BearingPaths` under `%LOCALAPPDATA%`, and `LocalFilePermissions` reporting
#     `PlatformDefault` rather than a Unix mode. Docker on a Windows runner cannot host a Linux container
#     without WSL2, so this leg has no database and its Postgres tests skip — by design, not by accident.
#
# `fail-fast: false` because a red leg must not hide the other leg's result: "it fails on Linux" and "it
# fails everywhere" are different diagnoses.
#
# **The suites run one project at a time, deliberately.** `dotnet test` on the solution runs test projects in
# parallel, and two of them (`Bearing.App.Tests` and `Bearing.Data.Tests`) both talk to the single Postgres
# container — so a solution-wide run flakes a *rotating* victim: a timeout test that loses its race, an
# autosave test whose connection is starved, or a `RequireWritableAsync` stamp probe that times out and reads
# as "not a Bearing test database" and skips. All of it looks like a regression and none of it is. Serialising
# costs a few minutes and buys a signal that means something.
#
# There is deliberately **no `dotnet format` gate**. It would fail today, and not on anything this repo wants
# changed: `tests/Bearing.Sql.Tests/SqlFormatSafetyTests.cs` groups its `[InlineData]` attributes several to a
# line, by category and with comments, so a theory over thirty operators reads as four ideas instead of thirty
# lines. `dotnet format` splits every one of them. Adding the gate means either a red check on main or losing
# that formatting, so it needs a decision about `.editorconfig` first — not a CI file.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One run per ref. Pushing twice to a PR should supersede the first run, not queue behind it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu (with postgres)
            os: ubuntu-latest
            database: true
          - name: windows
            os: windows-latest
            database: false

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the tag history (Directory.Build.props); a shallow clone has none and every build
          # is 0.0.0-alpha. Harmless for a test run, but it makes the version the build reports here the
          # same one a release would — so a version-shaped assertion cannot pass locally and fail only when
          # it matters.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Text measurement is load-bearing in the results grid — initial column widths, ellipsization and
      # scroll offsets all derive from it, which is why the headless UI tests use Skia rather than the
      # stub renderer (§4.5). Skia needs fontconfig and something to measure; the runner image has both,
      # and this makes that a stated dependency rather than a lucky one.
      - name: Install font libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig1 fonts-dejavu-core

      - name: Provision the test database
        if: matrix.database
        run: ./build/test-db.sh

      # Built once, separately, so a compile error is reported as a build failure instead of being buried in
      # the first test project's output.
      - name: Build
        run: dotnet build Bearing.slnx -c Release --nologo

      - name: Test
        shell: bash
        run: |
          set -uo pipefail
          failed=()
          for project in Sql Data Persistence Updates App; do
            echo "::group::Bearing.$project.Tests"
            # --no-build: the solution is already built above. Each project on its own, for the contention
            # reason in this file's header.
            if ! dotnet test "tests/Bearing.$project.Tests" -c Release --no-build --nologo; then
              failed+=("$project")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::failing suites: ${failed[*]}"
            exit 1
          fi

      # Said out loud in the log, because a skipped test is invisible in the summary and "0 failed" over a
      # suite that skipped its whole database half is the reassurance #24 was written to remove.
      - name: Note what did not run
        if: ${{ !matrix.database && !cancelled() }}
        run: echo "::notice::No Postgres on this leg — the live catalog tests skipped. The ubuntu leg runs them."
